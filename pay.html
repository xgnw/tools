<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>收款码 · 简单工具箱</title>
<style>
  :root {
    --ink: #10233c;
    --ink-2: #50627a;
    --ink-3: #8291a5;
    --line: #e2eaf4;
    --brand: #2b7fff;
    --brand-2: #1265e8;
    --surface: #ffffff;
    --ok: #168b45;
    --warning: #9a4b00;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(43,127,255,.16), transparent 65%),
      radial-gradient(800px 500px at 100% 0%, rgba(34,197,160,.12), transparent 60%),
      #f4f8fe;
  }
  .wrap { width: min(980px, 100%); margin: 0 auto; padding: 26px 16px 42px; }
  .head { text-align: center; padding: 10px 0 22px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 11px; border-radius: 99px;
    background: rgba(43,127,255,.09); color: var(--brand-2);
    font-size: 11.5px; font-weight: 700; letter-spacing: .4px;
  }
  h1 {
    margin: 14px 0 5px; font-size: clamp(26px, 5vw, 40px);
    line-height: 1.15; letter-spacing: -.8px; font-weight: 800;
  }
  .sub { margin: 0; color: var(--ink-3); font-size: 13px; }
  .notice {
    display: none; margin: 0 0 14px; padding: 12px 14px; border-radius: 12px;
    background: #fff7ec; border: 1px solid #f5d8b8; color: var(--warning);
    font-size: 13px; line-height: 1.65;
  }
  .notice.show { display: block; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .card {
    position: relative; display: flex; flex-direction: column; align-items: center;
    min-width: 0; padding: 18px 16px 16px; text-align: center;
    background: rgba(255,255,255,.92); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: 0 16px 38px -30px rgba(16,35,60,.35);
    backdrop-filter: blur(8px);
  }
  .card.off { display: none; }
  .card.primary { border-color: rgba(43,127,255,.45); box-shadow: 0 18px 42px -28px rgba(43,127,255,.55); }
  .card.primary::before {
    content: "推荐"; position: absolute; top: 10px; right: 10px;
    padding: 2px 8px; border-radius: 99px; background: var(--brand); color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
  }
  .icon {
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 46px; border-radius: 13px; margin-bottom: 8px;
    font-size: 19px; font-weight: 800;
  }
  .icon.ali { color: #9a4b00; background: #fff0df; }
  .icon.wx { color: #168b45; background: #e5f7ed; }
  .icon.qq { color: #1d63d6; background: #e8f1ff; }
  .brand { font-size: 14px; font-weight: 700; }
  .brand small { display: block; margin-top: 2px; color: var(--ink-3); font-size: 10.5px; font-weight: 500; }
  .qr {
    display: flex; align-items: center; justify-content: center;
    width: min(190px, 100%); aspect-ratio: 1; margin: 13px auto 12px;
    padding: 8px; border-radius: 13px; background: #fff;
    border: 1px solid #edf2f8;
  }
  .qr canvas { width: 100%; height: auto; display: block; image-rendering: pixelated; }
  .qerr { padding: 10px; color: #c4372d; font-size: 12px; line-height: 1.6; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 34px; padding: 0 14px; border-radius: 9px;
    border: 1px solid #d6e3f3; background: #fff; color: var(--ink-2);
    font-size: 12.5px; font-weight: 600; text-decoration: none;
  }
  .btn.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
  .btn.ghost { border-style: dashed; color: var(--ink-3); }
  .hint { margin-top: 8px; color: var(--ink-3); font-size: 11px; line-height: 1.6; }
  .foot {
    margin-top: 26px; text-align: center; color: var(--ink-3);
    font-size: 11.5px; line-height: 1.8;
  }
  .foot a { color: var(--brand-2); text-decoration: none; }
  @media (max-width: 760px) {
    .wrap { padding: 18px 12px 32px; }
    .grid { grid-template-columns: 1fr; gap: 10px; }
    .card { display: grid; grid-template-columns: 56px minmax(0, 1fr) 142px; gap: 6px 10px; align-items: center; text-align: left; padding: 13px; }
    .icon { width: 42px; height: 42px; margin: 0; grid-row: 1 / 3; }
    .brand { grid-column: 2; align-self: end; }
    .brand small { display: inline; margin-left: 5px; }
    .qr { grid-column: 3; grid-row: 1 / 4; width: 136px; margin: 0; padding: 6px; }
    .btn { grid-column: 2; justify-self: start; min-height: 30px; padding: 0 10px; font-size: 11.5px; }
    .hint { display: none; }
    .card.primary::before { top: 6px; right: 6px; }
  }
  @media (max-width: 380px) {
    .card { grid-template-columns: 46px minmax(0, 1fr) 118px; padding: 11px; }
    .qr { width: 116px; }
    .icon { width: 38px; height: 38px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">简单工具箱 · 收款码三合一</div>
    <h1 id="payee">扫码付款</h1>
    <p class="sub">请选择对应的收款方式，二维码由本页在浏览器里生成</p>
  </header>

  <div class="notice" id="notice"></div>

  <main class="grid" id="grid">
    <section class="card off" data-brand="ali">
      <div class="icon ali">支</div>
      <div class="brand">支付宝<small>Alipay</small></div>
      <div class="qr" id="qr-ali"></div>
      <a class="btn primary" id="open-ali" rel="noopener">打开支付宝</a>
      <div class="hint">也可以长按二维码识别付款</div>
    </section>

    <section class="card off" data-brand="wx">
      <div class="icon wx">微</div>
      <div class="brand">微信<small>WeChat</small></div>
      <div class="qr" id="qr-wx"></div>
      <span class="btn ghost">长按二维码付款</span>
      <div class="hint">在微信里打开时，长按识别二维码</div>
    </section>

    <section class="card off" data-brand="qq">
      <div class="icon qq">Q</div>
      <div class="brand">QQ<small>QQ Wallet</small></div>
      <div class="qr" id="qr-qq"></div>
      <span class="btn ghost">长按二维码付款</span>
      <div class="hint">在 QQ 里打开时，长按识别二维码</div>
    </section>
  </main>

  <div class="foot">
    由 <a href="https://tools.432600.xyz/" target="_blank" rel="noopener">简单工具箱</a> 在浏览器本地生成 ·
    不参与交易，也不保存收款信息
  </div>
</div>

<script src="assets/lib/qrcode.js"></script>
<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  function get(key) { return (params.get(key) || '').trim(); }
  function safe(value) {
    if (!value) return '';
    if (/^(https?:|alipays:|wxp:|weixin:|mqqapi:)/i.test(value)) return value;
    return '';
  }

  var data = {
    ali: safe(get('ali')),
    wx: safe(get('wx')),
    qq: safe(get('qq'))
  };
  var name = get('name').slice(0, 20) || '扫码付款';
  var payee = document.getElementById('payee');
  var notice = document.getElementById('notice');
  payee.textContent = name;
  document.title = name + ' · 收款码';

  /* 支付宝内直接跳转；微信 / QQ 内只高亮对应卡片，避免误点其它方式 */
  if (data.ali && /Alipay/i.test(navigator.userAgent || '')) {
    location.replace(data.ali);
    return;
  }

  var preferred = /MicroMessenger/i.test(navigator.userAgent || '') ? 'wx' :
                  /QQ\//i.test(navigator.userAgent || '') ? 'qq' : '';

  function drawQR(box, text) {
    box.textContent = '';
    try {
      var qr = window.qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      var count = qr.getModuleCount();
      var quiet = 4;
      var target = 220;
      var cell = Math.max(1, Math.floor(target / (count + quiet * 2)));
      var px = cell * (count + quiet * 2);
      var cv = document.createElement('canvas');
      cv.width = px;
      cv.height = px;
      var c = cv.getContext('2d');
      c.fillStyle = '#fff';
      c.fillRect(0, 0, px, px);
      c.fillStyle = '#111';
      var off = quiet * cell;
      for (var y = 0; y < count; y++) {
        for (var x = 0; x < count; x++) {
          if (qr.isDark(y, x)) c.fillRect(off + x * cell, off + y * cell, cell, cell);
        }
      }
      box.appendChild(cv);
    } catch (e) {
      var err = document.createElement('div');
      err.className = 'qerr';
      err.textContent = '二维码生成失败，链接可能过长';
      box.appendChild(err);
    }
  }

  var cards = document.querySelectorAll('.card');
  var shown = 0;
  Array.prototype.forEach.call(cards, function (card) {
    var brand = card.getAttribute('data-brand');
    var value = data[brand];
    if (!value) return;
    shown++;
    card.classList.remove('off');
    if (brand === preferred) card.classList.add('primary');
    drawQR(document.getElementById('qr-' + brand), value);

    if (brand === 'ali') {
      var open = document.getElementById('open-ali');
      open.href = value;
      open.target = '_self';
    }
  });

  if (!shown) {
    notice.className = 'notice show';
    notice.textContent = '这个收款页没有配置可用的收款方式，请联系收款人重新生成二维码。';
  }
})();
</script>
</body>
</html>
